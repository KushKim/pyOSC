# .github/workflows/release.yml
name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0.0 같은 태그가 푸시될 때만 실행
  workflow_dispatch: # 수동 실행

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # 1. 빌드하기 전에 태그 버전을 먼저 가져옵니다. (v를 제외한 숫자만 추출)
    - name: Get Version
      id: version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          TAG=${GITHUB_REF#refs/tags/}
          CLEAN_VERSION=${TAG#v} 
          echo "VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
        else
          echo "VERSION=dev" >> $GITHUB_ENV
        fi

    # 2. 파이썬 코드를 이용해 version.py 파일 안의 VERSION 값을 깃허브 태그로 자동 수정합니다.
    - name: Sync Version in Code
      shell: python
      run: |
        import os
        import re
        
        # version.py 경로 탐색 (src 폴더 안에 있는지, 최상단에 있는지 확인)
        file_path = 'src/version.py' if os.path.exists('src/version.py') else 'version.py'
        new_version = os.environ.get('VERSION', 'dev')
        
        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()
            
        # 정규식을 이용해 VERSION = "..." 부분을 새 버전으로 교체
        new_content = re.sub(r'VERSION\s*=\s*".*"', f'VERSION = "{new_version}"', content)
        
        with open(file_path, 'w', encoding='utf-8') as f:
            f.write(new_content)
            
        print(f"Successfully updated {file_path} to VERSION = {new_version}")

    # 3. 이제 업데이트된 version.py를 바탕으로 PyInstaller 빌드를 진행합니다.
    - name: Build with PyInstaller
      run: pyinstaller build.spec

    - name: Prepare Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        mkdir -p release_assets
        cp dist/OSC_Master_Tool.exe release_assets/OSC_Master_Tool_${{ env.VERSION }}_Windows.exe

    - name: Prepare Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        mkdir -p release_assets
        cd dist
        zip -r ../release_assets/OSC_Master_Tool_${{ env.VERSION }}_macOS.zip OSC_Master_Tool.app

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: release_assets/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true